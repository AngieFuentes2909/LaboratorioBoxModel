<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Credencial Digital - DevGenn</title>
    <!-- se importa Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card-container">
        <!-- ENCABEZADO ---->
        <header class="card-header">
            <span class="company-name">DEVGENN</span>
            <span class="card-type">CREDENCIAL DIGITAL</span>
            <span class="badge-verified">VERIFIED</span>
        </header>

        <!-- INFORMACIÓN PRINCIPAL -->
        <main class="card-body">
            <div class="avatar-container">
                <img src="https://i.ibb.co/675MsyYM/fotoab.jpg" alt="foto de la empleada" class="avatar">
            </div>

            <div class="info-details">
                <h1 class="employee-name">Angie Fuentes</h1>
                <p class="employee-role"><i class="fa-solid fa-laptop-code"></i> Frontend Developer</p>

                <ul class="info-list">
                    <li><i class="fa-solid fa-city"></i> <span>Ciudad:</span> Barranquilla</li>
                    <li><i class="fa-solid fa-envelope"></i> <span>Correo:</span> angiefuentes@devgenn.io</li>
                    <li><i class="fa-solid fa-code"></i> <span>Tecnología:</span> React & JavaScript</li>
                    <li><i class="fa-solid fa-book-open"></i> <span>Hobby:</span> Leer</li>
                    <li><i class="fa-brands fa-github"></i> <span>GitHub:</span> @angief29devgenn</li>
                </ul>
            </div>
        </main>

        <!-- PIE DE PÁGINA -->
        <footer class="card-footer">
            <p class="personal-quote">"Mi futuro depende de lo que haga hoy."</p>
            <div class="barcode-simulated"></div>
        </footer>
    </div>

</body>

</html>
